name: CodeQL
permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none
      - uses: github/codeql-action/analyze@v4
